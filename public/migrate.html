<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Pixel Run Storage Migration</title>
  </head>
  <body>
    <script>
      const NEW_ORIGIN = 'https://pixelrun.localplayer.dev';

      window.addEventListener('message', (event) => {
        if (event.origin !== NEW_ORIGIN || event.source !== window.parent) return;
        if (event.data?.type !== 'PIXEL_RUN_STORAGE_REQUEST') return;

        const storage = {};
        for (let i = 0; i < localStorage.length; i += 1) {
          const key = localStorage.key(i);
          if (!key || !key.startsWith('pixeldash.')) continue;
          const value = localStorage.getItem(key);
          if (value !== null) storage[key] = value;
        }

        event.source.postMessage({ type: 'PIXEL_RUN_STORAGE_RESPONSE', storage }, event.origin);
      });
    </script>
  </body>
</html>
